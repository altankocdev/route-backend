spring.application.name=route-backend


spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Istanbul

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
app.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}