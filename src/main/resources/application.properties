spring.application.name=route-backend

# Hangi profilin aktif olaca??n? belirliyor.
# Lokalde hiçbir ?ey vermezsen 'dev' varsay?lan olarak çal???r.
# Production'da bu, ortam de?i?keni (env var) ile 'prod' olarak override edilecek.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Jackson (JSON) genel ayarlar? - tum ortamlarda ayn? davran??
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Europe/Istanbul

# Flyway her ortamda aktif
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator - hangi endpoint'ler d??ar? aç?k olsun
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized